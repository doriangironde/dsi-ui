<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSi UI — component demo</title>
    <link rel="stylesheet" href="../src/theme.css" />
    <style>
      :root {
        background: #ededed;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 32px auto;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      header {
        display: grid;
        gap: 8px;
        margin-bottom: 24px;
      }

      header p {
        color: #687782;
        line-height: 1.6;
      }

      .bar,
      .grid {
        display: grid;
        gap: 16px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .panel {
        padding: 20px;
        border: 1px solid #b4b4b4;
        background: #f8f8f8;
        box-shadow: inset 0 0 0 2px white, 2px 2px #d4d4d4;
      }

      .panel h2 {
        margin-bottom: 16px;
        font-size: 16px;
        font-weight: 400;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      @media (max-width: 600px) {
        main {
          width: min(100% - 24px, 480px);
          margin: 20px auto;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <ds-status-bar label="DSi UI" battery="100"></ds-status-bar>
        <h1>DSi UI</h1>
        <p>Small, framework-independent custom elements for web interfaces.</p>
      </header>

      <div class="grid">
        <section class="panel">
          <h2>Actions</h2>
          <div class="row">
            <ds-button key="A" variant="primary">Select</ds-button>
            <ds-button key="B">Back</ds-button>
            <ds-icon-tile icon="settings" label="Settings" selected></ds-icon-tile>
            <ds-icon-tile icon="chat" label="Chat"></ds-icon-tile>
          </div>
        </section>

        <section class="panel">
          <h2>Navigation</h2>
          <ds-menu-item
            icon="profile"
            label="Profile"
            description="A short description for a menu row."
            selected
          ></ds-menu-item>
        </section>

        <section class="panel">
          <h2>Feedback</h2>
          <div class="bar">
            <ds-message tone="info">Your changes are ready.</ds-message>
            <ds-progress value="65" label="Downloading software..."></ds-progress>
          </div>
        </section>

        <section class="panel">
          <h2>Settings</h2>
          <div class="bar">
            <ds-toggle label="Sound effects" checked></ds-toggle>
            <ds-checkbox label="Show on home screen" checked></ds-checkbox>
            <ds-slider label="Brightness" value="72"></ds-slider>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="../src/dsi-ui.js"></script>
  </body>
</html>
